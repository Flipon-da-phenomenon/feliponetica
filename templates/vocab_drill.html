<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vocabulary Mastery</title>

<style>

/* =========================================================
   GLOBAL
   ========================================================= */

* {
    box-sizing: border-box;
}

:root {
    --bg-dark: #0b1020;
    --bg-mid: #111936;

    --primary: #6c63ff;
    --primary-light: #8f88ff;

    --blue: #3b82f6;
    --green: #22c55e;
    --orange: #f59e0b;
    --red: #ef4444;

    --text: #f8fafc;
    --text-soft: #aab4ca;

    --card: rgba(255, 255, 255, 0.075);
    --card-border: rgba(255, 255, 255, 0.12);

    --shadow:
        0 30px 70px rgba(0, 0, 0, 0.45),
        0 10px 25px rgba(0, 0, 0, 0.25);
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    margin: 0;
    padding: 40px 20px;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(108, 99, 255, 0.30),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 20%,
            rgba(59, 130, 246, 0.22),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 90%,
            rgba(34, 197, 94, 0.12),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #080c18 0%,
            #10172e 50%,
            #080c18 100%
        );

    overflow-x: hidden;
}


/* =========================================================
   BACKGROUND LIGHT EFFECTS
   ========================================================= */

body::before,
body::after {
    content: "";
    position: fixed;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    filter: blur(100px);

    pointer-events: none;

    opacity: 0.15;

    z-index: -1;
}

body::before {
    background: #6c63ff;
    top: -250px;
    left: -200px;
}

body::after {
    background: #3b82f6;
    bottom: -250px;
    right: -200px;
}


/* =========================================================
   MAIN CONTAINER
   ========================================================= */

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}


/* =========================================================
   HEADER
   ========================================================= */

.brand {
    text-align: center;
    margin-bottom: 35px;
}

.brand-icon {
    width: 68px;
    height: 68px;

    margin: 0 auto 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 20px;

    font-size: 30px;

    background:
        linear-gradient(
            135deg,
            #7c72ff,
            #4f46e5
        );

    box-shadow:
        0 15px 35px rgba(79, 70, 229, 0.40),
        inset 0 1px 1px rgba(255,255,255,0.25);
}

.brand h1 {
    margin: 0;

    font-size: 38px;
    font-weight: 800;

    letter-spacing: -1px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #b9c2ff
           );

    /* add both prefixed and unprefixed + fallbacks */
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
}

.brand p {
    margin: 10px 0 0;

    color: var(--text-soft);

    font-size: 16px;
}


/* =========================================================
   PREMIUM CARD
   ========================================================= */

.card {
    position: relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.10),
            rgba(255,255,255,0.045)
        );

    border: 1px solid var(--card-border);

    border-radius: 28px;

    box-shadow: var(--shadow);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    overflow: hidden;
}

.card::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.35),
            transparent
        );
}


/* =========================================================
   SETUP AREA
   ========================================================= */

#setupArea {
    padding: 45px;
}

.section-title {
    font-size: 24px;
    font-weight: 750;

    margin-bottom: 8px;
}

.section-subtitle {
    color: var(--text-soft);

    margin-bottom: 28px;

    line-height: 1.6;
}


/* =========================================================
   TEXTAREA
   ========================================================= */

.textarea-wrapper {
    position: relative;
}

textarea {
    width: 100%;
    height: 230px;

    resize: vertical;

    padding: 22px;

    border-radius: 18px;

    border: 1px solid rgba(255,255,255,0.13);

    background:
        rgba(5, 9, 22, 0.75);

    color: #f8fafc;

    font-family:
        "SFMono-Regular",
        Consolas,
        "Liberation Mono",
        monospace;

    font-size: 17px;

    line-height: 1.8;

    outline: none;

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease;
}

textarea:focus {
    border-color: rgba(108,99,255,0.8);

    box-shadow:
        0 0 0 4px rgba(108,99,255,0.12),
        0 15px 35px rgba(0,0,0,0.25);
}

textarea::placeholder {
    color: #65708a;
}


/* =========================================================
   BUTTONS
   ========================================================= */

.controls {
    margin-top: 25px;
}

button {
    border: none;

    font-family: inherit;

    cursor: pointer;

    transition:
        transform 0.18s ease,
        box-shadow 0.18s ease,
        filter 0.18s ease;

    user-select: none;
}

button:hover {
    transform: translateY(-2px);
}

button:active {
    transform: translateY(1px);
}


/* START */

.start-btn {
    width: 100%;

    padding: 18px 30px;

    border-radius: 15px;

    color: white;

    font-size: 18px;
    font-weight: 750;

    background:
        linear-gradient(
            135deg,
            #7c72ff,
            #4f46e5
        );

    box-shadow:
        0 12px 25px rgba(79,70,229,0.35),
        inset 0 1px 1px rgba(255,255,255,0.22);
}

.start-btn:hover {
    filter: brightness(1.08);

    box-shadow:
        0 16px 32px rgba(79,70,229,0.45),
        inset 0 1px 1px rgba(255,255,255,0.25);
}


/* GO ON */

.go-btn {
    min-width: 180px;

    padding: 17px 32px;

    border-radius: 14px;

    color: white;

    font-size: 18px;
    font-weight: 750;

    background:
        linear-gradient(
            135deg,
            #3b82f6,
            #2563eb
        );

    box-shadow:
        0 10px 25px rgba(37,99,235,0.30),
        inset 0 1px 1px rgba(255,255,255,0.2);
}

.go-btn:hover {
    box-shadow:
        0 15px 32px rgba(37,99,235,0.42),
        inset 0 1px 1px rgba(255,255,255,0.2);
}


/* REPEAT */

.repeat-btn {
    min-width: 150px;

    padding: 17px 28px;

    border-radius: 14px;

    color: white;

    font-size: 18px;
    font-weight: 750;

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #d97706
        );

    box-shadow:
        0 10px 25px rgba(245,158,11,0.28);
}


/* RESET */

.reset-btn {
    padding: 11px 22px;

    border-radius: 11px;

    color: #fca5a5;

    font-size: 14px;
    font-weight: 650;

    background:
        rgba(239,68,68,0.10);

    border: 1px solid rgba(239,68,68,0.20);
}

.reset-btn:hover {
    background:
        rgba(239,68,68,0.17);
}


/* =========================================================
   GAME AREA
   ========================================================= */

#gameArea {
    margin-top: 0;
}

.game-card {
    padding: 40px;
}


/* =========================================================
   ROUND HEADER
   ========================================================= */

.game-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 20px;

    margin-bottom: 35px;
}

.round-badge {
    display: inline-flex;

    align-items: center;
    gap: 9px;

    padding: 10px 16px;

    border-radius: 999px;

    background:
        rgba(108,99,255,0.14);

    border:
        1px solid rgba(108,99,255,0.28);

    color: #c4bfff;

    font-size: 14px;
    font-weight: 750;

    letter-spacing: 0.3px;
}

.round-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #8f88ff;

    box-shadow:
        0 0 10px rgba(143,136,255,0.8);
}

.progress-text {
    color: var(--text-soft);

    font-size: 15px;
    font-weight: 600;
}


/* =========================================================
   PROGRESS BAR
   ========================================================= */

.progress-container {
    width: 100%;
    height: 7px;

    background:
        rgba(255,255,255,0.07);

    border-radius: 99px;

    overflow: hidden;

    margin-bottom: 50px;
}

.progress-bar {
    height: 100%;

    border-radius: 99px;

    background:
        linear-gradient(
            90deg,
            #6c63ff,
            #3b82f6
        );

    box-shadow:
        0 0 15px rgba(108,99,255,0.55);

    transition:
        width 0.4s ease;
}


/* =========================================================
   WORD AREA
   ========================================================= */

.word-stage {
    min-height: 300px;

    display: flex;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 30px;

    border-radius: 22px;

    background:
        radial-gradient(
            circle at center,
            rgba(108,99,255,0.08),
            transparent 65%
        );

    border:
        1px solid rgba(255,255,255,0.05);

    margin-bottom: 35px;
}

#wordDisplay {
    font-size: clamp(42px, 7vw, 76px);

    font-weight: 800;

    letter-spacing: -2px;

    line-height: 1.15;

    max-width: 100%;

    word-wrap: break-word;

    color: white;

    text-shadow:
        0 10px 35px rgba(0,0,0,0.45);

    animation:
        wordAppear 0.3s ease;
}


/* =========================================================
   WORD ANIMATION
   ========================================================= */

@keyframes wordAppear {

    from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}


/* =========================================================
   BUTTON AREA
   ========================================================= */

#buttonArea {
    display: flex;

    justify-content: center;
    align-items: center;

    gap: 12px;

    min-height: 75px;
}


/* =========================================================
   FINISH STATE
   ========================================================= */

.finished-icon {
    width: 75px;
    height: 75px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    font-size: 35px;

    background:
        linear-gradient(
            135deg,
            #22c55e,
            #16a34a
        );

    box-shadow:
        0 15px 35px rgba(34,197,94,0.3);
}


/* =========================================================
   HIDDEN
   ========================================================= */

.hidden {
    display: none !important;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 700px) {

    body {
        padding: 20px 12px;
    }

    .brand h1 {
        font-size: 30px;
    }

    #setupArea,
    .game-card {
        padding: 25px;
    }

    .game-header {
        align-items: flex-start;
        flex-direction: column;
    }

    .word-stage {
        min-height: 250px;
    }

    #wordDisplay {
        font-size: 45px;
    }

    #buttonArea {
        flex-direction: column;
    }

    .go-btn,
    .repeat-btn {
        width: 100%;
    }

}


/* =========================================================
   SMALL SCREEN
   ========================================================= */

@media (max-width: 420px) {

    textarea {
        height: 200px;
        font-size: 15px;
    }

    .word-stage {
        padding: 20px;
    }

    #wordDisplay {
        font-size: 38px;
    }

}

</style>
</head>


<body>

    <!-- =========================
         NAVIGATION
         ========================= -->

    <nav class="navbar">

        <div class="nav-container">

            <a href="/" class="logo">
                Felipe<span>netica</span>
            </a>

            <a href="{{ url_for('live_classes') }}">

            </a>
            </div>

        </div>

    </nav>


<div class="container">


<!-- =====================================================
     BRAND
     ===================================================== -->

<div class="brand">

    <div class="brand-icon">
        ◈
    </div>

    <h1>Vocabulary Mastery</h1>

    <p>
        Build your vocabulary one word at a time.
    </p>

</div>


<!-- =====================================================
     SETUP
     ===================================================== -->

<div id="setupArea" class="card">

    <div class="section-title">
        Create Your Vocabulary Set
    </div>

    <div class="section-subtitle">
        Enter your vocabulary below. Use one English word
        and its Spanish translation on each line.
    </div>


    <div class="textarea-wrapper">

<textarea id="vocabInput">lucky = afortunado
unusual = no común
silly = tonto
strong = fuerte</textarea>

    </div>


    <div class="controls">

        <button
            id="startBtn"
            class="start-btn">
            Start Learning
        </button>

    </div>

</div>


<!-- =====================================================
     GAME
     ===================================================== -->

<div id="gameArea" class="card game-card hidden">


    <!-- HEADER -->

    <div class="game-header">

        <div
            id="roundInfo"
            class="round-badge">

            <span class="round-dot"></span>

            Round 1

        </div>


        <div
            id="progressInfo"
            class="progress-text">

            Word 1 of 1

        </div>

    </div>


    <!-- PROGRESS -->

    <div class="progress-container">

        <div
            id="progressBar"
            class="progress-bar"
            style="width: 100%;">
        </div>

    </div>


    <!-- WORD -->

    <div class="word-stage">

        <div id="wordDisplay"></div>

    </div>


    <!-- BUTTONS -->

    <div id="buttonArea">

        <button
            id="repeatBtn"
            class="repeat-btn hidden">

            ↻ Repeat

        </button>


        <button
            id="goBtn"
            class="go-btn">

            Go On →

        </button>

    </div>


    <!-- RESET -->

    <div style="text-align:center; margin-top:30px;">

        <button
            id="resetBtn"
            class="reset-btn">

            Reset Session

        </button>

    </div>


</div>


</div>


<script>


/* =========================================================
   VOCABULARY DATA
   ========================================================= */

let vocabulary = [];


/* Current round */

let currentRound = 1;


/* Current word inside round */

let currentWordIndex = 0;


/* Translation visibility */

let translationVisible = false;


/* =========================================================
   ELEMENTS
   ========================================================= */

const startBtn =
    document.getElementById("startBtn");

const resetBtn =
    document.getElementById("resetBtn");

const goBtn =
    document.getElementById("goBtn");

const repeatBtn =
    document.getElementById("repeatBtn");


const roundInfo =
    document.getElementById("roundInfo");

const progressInfo =
    document.getElementById("progressInfo");

const wordDisplay =
    document.getElementById("wordDisplay");

const progressBar =
    document.getElementById("progressBar");


const setupArea =
    document.getElementById("setupArea");

const gameArea =
    document.getElementById("gameArea");


/* =========================================================
   PARSE VOCABULARY
   ========================================================= */

function parseVocabulary() {

    const raw =
        document.getElementById("vocabInput").value;

    const lines =
        raw.split(/\r?\n/);

    const pairs = [];


    lines.forEach(line => {

        const cleaned =
            line.trim();


        if (cleaned === "") {
            return;
        }


        const parts =
            cleaned.split("=");


        if (parts.length < 2) {
            return;
        }


        const english =
            parts[0].trim();


        const spanish =
            parts.slice(1)
                 .join("=")
                 .trim();


        if (english && spanish) {

            pairs.push({
                english: english,
                spanish: spanish
            });

        }

    });


    return pairs;
}


/* =========================================================
   START SESSION
   ========================================================= */

startBtn.addEventListener("click", () => {


    vocabulary =
        parseVocabulary();


    if (vocabulary.length === 0) {

        alert(
            "Enter at least one vocabulary pair."
        );

        return;
    }


    /*
       IMPORTANT:

       Vocabulary is NOT shuffled.

       The order entered by the teacher
       is the order used by the drill.
    */


    currentRound = 1;

    currentWordIndex = 0;

    translationVisible = false;


    setupArea.classList.add("hidden");

    gameArea.classList.remove("hidden");


    goBtn.classList.remove("hidden");

    repeatBtn.classList.add("hidden");


    renderScreen();

});


/* =========================================================
   RENDER SCREEN
   ========================================================= */

function renderScreen() {


    updateHeaders();


    const pair =
        vocabulary[currentWordIndex];


    if (!translationVisible) {


        /* English only */

        wordDisplay.textContent =
            pair.english;


        repeatBtn.classList.add(
            "hidden"
        );


        goBtn.textContent =
            "Go On →";


    } else {


        /* English + Spanish */

        wordDisplay.textContent =
            pair.english +
            " — " +
            pair.spanish;


        repeatBtn.classList.remove(
            "hidden"
        );


        goBtn.textContent =
            "Go On →";

    }


    /* Restart animation */

    wordDisplay.style.animation = "none";

    void wordDisplay.offsetWidth;

    wordDisplay.style.animation =
        "wordAppear 0.3s ease";
}


/* =========================================================
   UPDATE HEADERS
   ========================================================= */

function updateHeaders() {

    roundInfo.innerHTML =
        '<span class="round-dot"></span>' +
        'Round ' +
        currentRound;

    const totalWords = vocabulary.length || 1;

    progressInfo.textContent =
        "Word " +
        (currentWordIndex + 1) +
        " of " +
        totalWords;

    const progress =
        (
            (currentWordIndex + 1) /
            totalWords
        ) * 100;

    progressBar.style.width =
        progress + "%";
}


/* =========================================================
   GO ON
   ========================================================= */

goBtn.addEventListener("click", () => {


    /*
       STEP 1

       English is showing.

       Go On reveals translation.
    */

    if (!translationVisible) {

        translationVisible = true;

        renderScreen();

        return;
    }


    /*
       STEP 2

       Translation is showing.

       Go On moves to next word.
    */

    currentWordIndex++;


    /*
       More words remain
       in this round.
    */

    if (
        currentWordIndex <
        currentRound
    ) {

        translationVisible = false;

        renderScreen();

        return;
    }


    /*
       Current round is complete.

       Add exactly ONE new word
       to the next round.
    */

    currentRound++;


    /*
       All rounds complete.
    */

    if (
        currentRound >
        vocabulary.length
    ) {

        showFinished();

        return;
    }


    /*
       Begin new round.

       Always return to Word 1.
    */

    currentWordIndex = 0;

    translationVisible = false;

    renderScreen();

});


/* =========================================================
   REPEAT
   ========================================================= */

repeatBtn.addEventListener("click", () => {


    /*
       Repeat does NOT advance.

       It simply hides the Spanish
       and shows the SAME English word.
    */

    translationVisible = false;

    renderScreen();

});


/* =========================================================
   FINISHED
   ========================================================= */

function showFinished() {


    roundInfo.innerHTML =
        '<span class="round-dot"></span>' +
        'Complete';


    progressInfo.textContent =
        "Vocabulary mastered";


    progressBar.style.width =
        "100%";


    wordDisplay.innerHTML =
        '<div>' +
            '<div class="finished-icon">✓</div>' +
            '<div style="font-size:32px;">' +
                'Excellent Work!' +
            '</div>' +
            '<div style="font-size:16px; color:#aab4ca; margin-top:10px;">' +
                'All vocabulary rounds completed.' +
            '</div>' +
        '</div>';


    goBtn.classList.add("hidden");

    repeatBtn.classList.add("hidden");

}


/* =========================================================
   RESET
   ========================================================= */

resetBtn.addEventListener("click", () => {


    vocabulary = [];


    currentRound = 1;

    currentWordIndex = 0;

    translationVisible = false;


    setupArea.classList.remove(
        "hidden"
    );


    gameArea.classList.add(
        "hidden"
    );


    goBtn.classList.remove(
        "hidden"
    );


    repeatBtn.classList.add(
        "hidden"
    );


    goBtn.textContent =
        "Go On →";

});

</script>

</body>
</html>
