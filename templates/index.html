<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>English Course Portal</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; color: #333; }
        header { background-color: #1a365d; color: white; padding: 2.5rem; text-align: center; }
        .container { max-width: 800px; margin: 3rem auto; padding: 0 1rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2b6cb0;
            color: white;
            padding: 1.5rem 1rem;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            text-align: center;
        }
        .btn:hover { background-color: #2c5282; transform: translateY(-3px); }
        .btn-accent { background-color: #2b8a3e; }
        .btn-accent:hover { background-color: #237032; }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to the English Course Portal</h1>
        <p>Interactive lessons, transcript tool, and learning resources</p>
    </header>

    <div class="container">
        <div class="grid">
            <a href="/feliponetica" class="btn btn-accent">Feliponetica Inglés-&gt;Espanol</a>
            <a href="/lessons" class="btn">Lessons</a>
            <a href="/course" class="btn">Course</a>
            <a href="/about" class="btn">About</a>
            <a href="/vocab_drill" class="btn">vocab_drill</a>
            <a href="/live-classes" class="btn">Live Classes</a>
            <a href="/contact" class="btn">Contact</a>
        </div>
    </div>

</body>
</html>
